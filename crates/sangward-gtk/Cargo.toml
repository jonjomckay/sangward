[package]
name = "sangward-gtk"
description = "sangward GTK4/libadwaita frontend (Relm4)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sangward-ipc.workspace = true
sangward-client.workspace = true
sangward-platform.workspace = true
relm4.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
sangward-ipc.workspace = true
tokio.workspace = true

# In-process UI tests. GTK needs the process main thread, so no libtest harness.
# Needs a display; run via `just gtk-ui` (Xvfb + private D-Bus), not plain `cargo test`.
[[test]]
name = "ui"
harness = false
test = false

[lints]
