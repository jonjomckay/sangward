[package]
name = "keyward-gtk"
description = "keyward GTK4/libadwaita frontend (Relm4)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
keyward-ipc.workspace = true
keyward-client.workspace = true
keyward-platform.workspace = true
relm4.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
keyward-ipc.workspace = true
