[package]
name = "sangward-core"
description = "Models, Bitwarden-compatible API client, crypto, sync and encrypted cache"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Test-only helpers: account registration, 2FA enabling and the `sangward-testkit` binary.
test-support = ["dep:clap", "tokio/rt", "tokio/macros"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
url.workspace = true
aes.workspace = true
cbc.workspace = true
hmac.workspace = true
sha1.workspace = true
sha2.workspace = true
hkdf.workspace = true
pbkdf2.workspace = true
argon2.workspace = true
rsa.workspace = true
rand.workspace = true
subtle.workspace = true
base64.workspace = true
totp-rs.workspace = true
secrecy.workspace = true
zeroize.workspace = true
uuid.workspace = true
thiserror.workspace = true
tracing.workspace = true
libc.workspace = true
clap = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "sangward-testkit"
path = "src/bin/testkit.rs"
required-features = ["test-support"]

[lints]
workspace = true
